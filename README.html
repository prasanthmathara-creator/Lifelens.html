<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Whiteboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden;
        }

        /* Sidebar Toolbar */
        .toolbar {
            width: 250px;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        .toolbar h2 {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 5px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Color Picker */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 50px;
            border-radius: 8px;
            cursor: pointer;
        }

        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"]::-webkit-color-swatch {
            border: 2px solid #ddd;
            border-radius: 8px;
        }

        /* Brush Buttons */
        .brush-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            padding: 10px;
            border: 1px solid #ccc;
            background-color: #f9f9f9;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #e9e9e9;
        }

        .btn.active {
            background-color: #007bff;
            color: white;
            border-color: #0056b3;
        }

        /* Size Slider */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-container input {
            flex: 1;
        }

        /* Canvas Area */
        .canvas-container {
            flex: 1;
            position: relative;
            background-color: #ffffff;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        .btn-clear {
            background-color: #dc3545;
            color: white;
            border: none;
            margin-top: auto;
        }

        .btn-clear:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <!-- Sidebar Controls -->
    <div class="toolbar">
        <div class="section">
            <h2>Color Wheel</h2>
            <input type="color" id="colorPicker" value="#000000">
        </div>

        <div class="section">
            <h2>5 Brushes</h2>
            <div class="brush-list">
                <button class="btn active" onclick="setBrush('pen')">1. Normal Pen</button>
                <button class="btn" onclick="setBrush('calligraphy')">2. Calligraphy</button>
                <button class="btn" onclick="setBrush('spray')">3. Spray Can</button>
                <button class="btn" onclick="setBrush('highlighter')">4. Highlighter</button>
                <button class="btn" onclick="setBrush('eraser')">5. Eraser</button>
            </div>
        </div>

        <div class="section">
            <h2>Brush Size</h2>
            <div class="slider-container">
                <input type="range" id="brushSize" min="1" max="50" value="5">
                <span id="sizeValue">5px</span>
            </div>
        </div>

        <button class="btn btn-clear" onclick="clearCanvas()">Clear Board</button>
    </div>

    <!-- Main Whiteboard Canvas -->
    <div class="canvas-container">
        <canvas id="whiteboard"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('whiteboard');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        const sizeValue = document.getElementById('sizeValue');

        let isDrawing = false;
        let currentBrush = 'pen';
        let lastX = 0;
        let lastY = 0;

        // Resize Canvas to fill screen
        function resizeCanvas() {
            // Save current drawing content before resizing
            const image = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = window.innerWidth - 250;
            canvas.height = window.innerHeight;
            ctx.putImageData(image, 0, 0);
        }

        window.addEventListener('resize', resizeCanvas);
        
        // Initial set up
        canvas.width = window.innerWidth - 250;
        canvas.height = window.innerHeight;

        // Update Brush Size label
        brushSize.addEventListener('input', (e) => {
            sizeValue.textContent = `${e.target.value}px`;
        });

        // Brush Selection
        function setBrush(brushType) {
            currentBrush = brushType;
            
            // Toggle active UI button styling
            const buttons = document.querySelectorAll('.brush-list .btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // Draw Actions
        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
            draw(e); // Allow single dot clicks
        }

        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath(); // Reset paths
        }

        function draw(e) {
            if (!isDrawing) return;

            const color = colorPicker.value;
            const size = brushSize.value;
            const x = e.offsetX;
            const y = e.offsetY;

            ctx.fillStyle = color;
            ctx.strokeStyle = color;

            // Apply different brush techniques
            switch (currentBrush) {
                case 'pen':
                    ctx.globalAlpha = 1.0;
                    ctx.lineWidth = size;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    break;

                case 'calligraphy':
                    ctx.globalAlpha = 1.0;
                    ctx.lineWidth = size;
                    ctx.lineCap = 'square';
                    // Creates an angled ribbon effect
                    ctx.beginPath();
                    ctx.moveTo(lastX - size, lastY - size);
                    ctx.lineTo(x + size, y + size);
                    ctx.stroke();
                    break;

                case 'spray':
                    ctx.globalAlpha = 1.0;
                    const density = size * 2;
                    for (let i = 0; i < density; i++) {
                        const offsetX = (Math.random() - 0.5) * size * 2;
                        const offsetY = (Math.random() - 0.5) * size * 2;
                        ctx.fillRect(x + offsetX, y + offsetY, 1, 1);
                    }
                    break;

                case 'highlighter':
                    ctx.globalAlpha = 0.2; // Transparent glow effect
                    ctx.lineWidth = size * 2;
                    ctx.lineCap = 'square';
                    ctx.lineJoin = 'miter';
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    break;

                case 'eraser':
                    ctx.globalAlpha = 1.0;
                    ctx.strokeStyle = '#ffffff'; // Uses white to erase
                    ctx.lineWidth = size * 2;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    ctx.lineTo(x, y);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(x, y);
                    break;
            }

            [lastX, lastY] = [x, y];
        }

        // Canvas Clear Function
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Event Listeners for Drawing
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseout', stopDrawing);
    </script>
</body>
  </html>
